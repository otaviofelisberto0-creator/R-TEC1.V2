<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempo TEC1</title><style>:root{--r:#DA291C;--d:#B82018;--y:#FFD600}*{box-sizing:border-box}body{margin:0;padding-bottom:38px;font:16px/1.5 Segoe UI,Arial;background:#f4f6f9;color:#17233b}header{height:84px;background:var(--r);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 22px}header img{width:108px}.layout{display:grid;grid-template-columns:72px 1fr}.layout.open{grid-template-columns:230px 1fr}.side{background:var(--r);min-height:calc(100vh - 84px);padding:10px}.side a,.side button{display:flex;gap:12px;align-items:center;width:100%;height:50px;margin-bottom:8px;padding:0 14px;border:1px solid #ffffff80;border-radius:9px;background:transparent;color:#fff;text-decoration:none;font-size:16px;font-weight:700;white-space:nowrap}.txt{display:none}.open .txt{display:inline}.ico{font-size:21px;min-width:24px}main{min-width:0;padding:20px}.card{background:#fff;border:1px solid #ead0cd;border-radius:13px;padding:17px;margin-bottom:14px}.filters{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:11px}label{font-size:14px;font-weight:700}select,input,button{width:100%;min-height:48px;margin-top:5px;padding:9px;border:2px solid #d6aaa6;border-radius:8px;font-size:15px}button{background:var(--r);color:#fff;font-weight:800}.view{overflow:auto}.weather{border-collapse:separate;border-spacing:0;min-width:1100px;width:100%;font-size:14px}.weather th{position:sticky;top:0;background:var(--r);color:#fff;z-index:5}.weather th,.weather td{padding:10px;border-bottom:1px solid #ddd;text-align:center}.weather th:first-child,.weather td:first-child{position:sticky;left:0;min-width:180px;background:#fff;z-index:8}.weather th:first-child{background:var(--r)}.wx{display:block;font-size:30px}.temp{font-size:17px;font-weight:800}.cond{font-size:13px}.footer{position:fixed;bottom:0;left:0;right:0;background:#000;color:var(--y);padding:8px;text-align:center;font-size:12px}@media(max-width:800px){.layout,.layout.open{display:block}.side{display:flex;min-height:0;overflow:auto}.txt,.open .txt{display:none}.filters{grid-template-columns:1fr}}</style></head><body><header><img src="./assets/claro-logo.png" alt="Claro"><h1>Tempo</h1></header><div id="layout" class="layout"><nav class="side"><button id="toggle"><span class="ico">☰</span><span class="txt">Menu</span></button><a href="./index.html"><span class="ico">▣</span><span class="txt">Dashboard</span></a><a href="./tempo.html"><span class="ico">☀</span><span class="txt">Tempo</span></a><a href="./admin.html"><span class="ico">⚙</span><span class="txt">Administração</span></a></nav><main><section class="card"><h2>Previsão por cidade</h2><div class="filters"><label>Regional<select id="regional"></select></label><label>Cluster<select id="cluster"></select></label><label>SubCluster<select id="subcluster"></select></label><label>Período inicial<input id="ini" type="date"></label><label>Período final<input id="fim" type="date"></label><label>Ações<button id="go">Consultar</button></label></div><p>Condições meteorológicas apresentadas por ícones próprios: sol, nublado, chuva e temporal.</p></section><section class="card"><div id="status"></div><div class="view"><table id="table" class="weather"></table></div></section></main></div><footer class="footer">MATERIAL CRIADO POR OTAVIO J. FELISBERTO - GRUPO SC - GRUPO CLUSTER FLORIANÓPOLIS - Diretoria de Serviços Técnicos | Instalações RPS</footer><script>
let DATA=[];const $=s=>document.querySelector(s),ico=c=>c===0?'☀️':[1,2].includes(c)?'🌤️':c===3?'☁️':[45,48].includes(c)?'🌫️':[51,53,55,61,63,65,80,81,82].includes(c)?'🌧️':[95,96,99].includes(c)?'⛈️':'❔',desc=c=>c===0?'Sol':[1,2].includes(c)?'Sol entre nuvens':c===3?'Nublado':[45,48].includes(c)?'Neblina':[51,53,55,61,63,65,80,81,82].includes(c)?'Chuva':[95,96,99].includes(c)?'Temporal':'Sem previsão';function fill(){let st={regional:$('#regional').value,cluster:$('#cluster').value,subcluster:$('#subcluster').value};for(let [id,f] of [['regional','regional'],['cluster','cluster'],['subcluster','subcluster']]){let e=$('#'+id),old=e.value||'TODOS',v=[...new Set(DATA.filter(r=>Object.entries(st).every(([k,x])=>k===f||!x||x==='TODOS'||r[k]===x)).map(r=>r[f]).filter(Boolean))].sort();e.innerHTML='<option value="TODOS">Todos</option>'+v.map(x=>`<option>${x}</option>`).join('');e.value=v.includes(old)?old:'TODOS'}}async function forecast(city,a,b){let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=pt&format=json').then(r=>r.json()),p=g.results?.[0];if(!p)return null;return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&hourly=temperature_2m,weather_code,precipitation_probability&timezone=America%2FSao_Paulo&start_date=${a}&end_date=${b}`).then(r=>r.json())}function at(j,d,h){let i=j?.hourly?.time.findIndex(x=>x===d+'T'+String(h).padStart(2,'0')+':00');return i<0?null:{t:Math.round(j.hourly.temperature_2m[i]),c:j.hourly.weather_code[i],r:j.hourly.precipitation_probability[i]}}$('#go').onclick=async()=>{let a=$('#ini').value,b=$('#fim').value,st={regional:$('#regional').value,cluster:$('#cluster').value,subcluster:$('#subcluster').value},cities=[...new Set(DATA.filter(r=>Object.entries(st).every(([k,x])=>!x||x==='TODOS'||r[k]===x)).map(r=>r.cidade))].sort(),ds=[];for(let d=new Date(a+'T12:00');d<=new Date(b+'T12:00');d.setDate(d.getDate()+1))ds.push(d.toISOString().slice(0,10));$('#status').textContent='Consultando '+cities.length+' cidades...';let rows=[];for(let c of cities){try{rows.push([c,await forecast(c,a,b)])}catch{rows.push([c,null])}}let h='<thead><tr><th rowspan="2">Cidade</th>'+ds.map(d=>`<th colspan="2">${d.slice(8,10)}/${d.slice(5,7)}</th>`).join('')+'</tr><tr>'+ds.map(()=>'<th>Manhã</th><th>Tarde</th>').join('')+'</tr></thead><tbody>';for(let [c,j] of rows){h+='<tr><td>'+c+'</td>';for(let d of ds)for(let x of [at(j,d,9),at(j,d,15)])h+=x?`<td><span class="wx">${ico(x.c)}</span><span class="temp">${x.t}°C</span><div class="cond">${desc(x.c)} · ${x.r??'-'}%</div></td>`:'<td>❔<br>Sem previsão</td>';h+='</tr>'}$('#table').innerHTML=h+'</tbody>';$('#status').textContent='Atualizado em '+new Date().toLocaleString('pt-BR')};async function start(){let m=await fetch('./dados/manifest.json?t='+Date.now()).then(r=>r.json()),x=m.arquivos.find(y=>y.competencia===m.competenciaAtual)||m.arquivos[0],j=await fetch('./dados/'+x.arquivo+'?t='+Date.now()).then(r=>r.json());DATA=j.dados||[];fill();let a=new Date(),b=new Date();b.setDate(a.getDate()+6);$('#ini').value=a.toISOString().slice(0,10);$('#fim').value=b.toISOString().slice(0,10)}['regional','cluster','subcluster'].forEach(x=>$('#'+x).onchange=fill);$('#toggle').onclick=()=>$('#layout').classList.toggle('open');start();
</script></body></html>
