<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempo | Dashboard TEC1</title><style>body{margin:0;font:16px/1.45 Segoe UI,Arial;background:#f4f6f9;color:#12213b}header{background:#da291c;color:#fff;padding:20px 24px;font-size:26px;font-weight:800}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.nav a{color:#b82018;font-weight:700;margin-right:18px}.card{background:#fff;border:1px solid #e8cbc7;border-radius:14px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#fff7f5;border-radius:10px;padding:15px}.kpi b{display:block;font-size:28px}.status{padding:12px;background:#eef3f8;border-radius:8px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header>Claro | Tempo</header><main class="wrap"><nav class="nav"><a href="./index.html">Dashboard</a><a href="./tempo.html">Tempo</a><a href="./admin.html">Administração</a></nav><section class="card"><h1>Condições do tempo</h1><p>Informe a cidade para consultar as condições atuais.</p><form id="form"><input id="cidade" value="Florianópolis" required style="min-height:44px;padding:7px;border:2px solid #d6aaa6;border-radius:8px"><button style="min-height:44px;padding:7px 16px;background:#da291c;color:#fff;border:0;border-radius:8px;font-weight:800">Consultar</button></form><p id="status" class="status">Aguardando consulta.</p><div id="dados" class="grid"></div></section></main><script>const $=s=>document.querySelector(s);async function consultar(e){e?.preventDefault();let q=$('#cidade').value.trim();if(!q)return;$('#status').textContent='Consultando...';$('#dados').innerHTML='';try{let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&format=json&name='+encodeURIComponent(q)).then(r=>r.json()),p=g.results?.[0];if(!p)throw Error('Cidade não localizada.');let w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,wind_speed_10m&timezone=auto`).then(r=>r.json()),c=w.current;$('#status').textContent=`${p.name} - ${p.admin1||''} | Atualizado: ${new Date().toLocaleString('pt-BR')}`;$('#dados').innerHTML=[['Temperatura',c.temperature_2m+' °C'],['Sensação',c.apparent_temperature+' °C'],['Umidade',c.relative_humidity_2m+'%'],['Vento',c.wind_speed_10m+' km/h']].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}catch(err){$('#status').textContent='Não foi possível consultar: '+err.message}}$('#form').onsubmit=consultar;consultar();</script></body></html>
