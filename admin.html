<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração TEC1</title><style>:root{--r:#da291c;--rd:#b82018;--line:#e8cbc7}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Segoe UI,Arial;background:#f4f6f9;color:#17233b}header{height:84px;background:var(--r);color:white;display:flex;align-items:center;padding:12px 22px}.brand{display:flex;align-items:center;gap:20px}.claro{position:relative;min-width:120px;font-size:38px;font-weight:900;letter-spacing:-2px}.claro:after{content:'✦';position:absolute;right:3px;top:-15px;font-size:15px}.divider{height:38px;width:1px;background:#ffffffaa}.title{font-size:27px}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}.fields{display:grid;grid-template-columns:1.5fr .7fr;gap:14px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}label{font-size:15px;font-weight:700}input,select,.btn{width:100%;min-height:52px;padding:11px 13px;margin-top:6px;border:2px solid #d6aaa6;border-radius:9px;font-size:16px}.btn{display:flex;align-items:center;justify-content:center;background:var(--r);color:white;text-decoration:none;font-weight:800;cursor:pointer}.btn.light{background:#fff3f1;color:var(--rd)}.btn:disabled{background:#bbb;color:#555}.status{display:none;margin-top:14px;padding:14px;background:#edf9f2;border-left:6px solid #087b42;white-space:pre-wrap}.nav{display:flex;gap:10px;margin-top:15px}.nav a{color:var(--rd);font-weight:700}@media(max-width:750px){.fields,.actions{grid-template-columns:1fr}}</style></head><body><header><div class="brand"><span class="claro">Claro</span><span class="divider"></span><span class="title">Administração TEC1</span></div></header><main class="wrap"><div class="nav"><a href="./index.html">Dashboard</a><a href="./tempo.html">Tempo</a></div><section class="card"><h2>Preparar arquivo mensal</h2><div class="fields"><label>Arquivo CSV<input id="csv" type="file" accept=".csv"></label><label>Competência<select id="comp"></select></label></div><div class="actions"><button id="convert" class="btn">1. Converter CSV para JSON</button><button id="download" class="btn" disabled>2. Baixar arquivo JSON</button><a class="btn light" href="https://github.com/login" target="_blank">3. Entrar no GitHub</a></div><div id="status" class="status"></div></section><section class="card"><h2>Publicar no GitHub</h2><div class="actions"><a class="btn" href="https://github.com/otaviofelisberto0-creator/R-TEC1.V2/upload/main/dados" target="_blank">Publicar JSON na pasta dados</a><a class="btn light" href="https://github.com/otaviofelisberto0-creator/R-TEC1.V2/edit/main/dados/manifest.json" target="_blank">Registrar competência</a><a class="btn light" href="./index.html">Voltar ao Dashboard</a></div></section></main><script>let text='',generated,name;const $=s=>document.querySelector(s),N=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase(),K=v=>N(v).replace(/[^A-Z0-9]/g,''),num=v=>Number(String(v??'').replace(',','.'))||0;function split(l,s){let a=[],x='',q=false;for(let c of l){if(c==='"')q=!q;else if(c===s&&!q){a.push(x);x=''}else x+=c}a.push(x);return a}function parse(t){let l=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),sep=l[0].includes(';')?';':',',h=split(l[0],sep).map(K);return l.slice(1).map(z=>{let v=split(z,sep),o={};h.forEach((k,i)=>o[k]=v[i]||'');return o})}function pick(r,n){for(let x of n){let v=r[K(x)];if(v)return v}return''}let c=$('#comp'),y=new Date().getFullYear();for(let a=y-2;a<=y+1;a++)for(let m=1;m<=12;m++){let v=`${a}-${String(m).padStart(2,'0')}`;c.insertAdjacentHTML('beforeend',`<option value="${v}">${v}</option>`)}$('#csv').onchange=async()=>{let f=$('#csv').files[0],b=await f.arrayBuffer();text=new TextDecoder().decode(b);let m=f.name.match(/(\d{2})[-.](\d{2})-tec1/i);if(m)c.value=`20${m[1]}-${m[2]}`};$('#convert').onclick=()=>{let rows=parse(text),comp=c.value,map=new Map(),tm=new Map();for(let r of rows){let ur=N(pick(r,['UN_RESP'])),go=N(pick(r,['GRUPO_OS'])),to=N(pick(r,['TIPO_OS'])),id=String(pick(r,['LISTA_ID_OS'])).replace(/\.0$/,''),tipo=ur==='INSTALACAO'&&go==='SERVICOS'&&to==='MUDANCA DE PACOTE'&&id==='24'?'MIGRACAO':ur==='INSTALACAO'&&go==='INSTALACAO'&&['1','43','51','516'].includes(id)?'ADESAO':'',un=pick(r,['UNIDADE_NEGOCIO']),epo=un.includes('-')?un.split('-').slice(1).join('-'):'NAO INFORMADO',t=num(pick(r,['QTD_TOTAL_OS_TEC1'])),p=num(pick(r,['TOTAL_OS_TEC1_PADRAO']));if(!t)continue;let dt=pick(r,['DATA_NOTA']).split('/').reverse().join('-'),o={data:dt,grupoOS:ur,tipoInstalacao:tipo,regional:pick(r,['NM_GRUPO_REGIONAL']),cluster:pick(r,['DSC_CLUSTER']),subcluster:pick(r,['SUBCLUSTER']),cidade:pick(r,['NM_MUNICIPIO']),un,epo,totalOS:t,padrao:p,treinado:0,complete:0,notdone:0,revisita:num(pick(r,['QT_REVISITA']))},key=[dt,ur,tipo,o.regional,o.cluster,o.subcluster,o.cidade,un,epo].join('|'),a=map.get(key)||{...o,totalOS:0,padrao:0,revisita:0};a.totalOS+=t;a.padrao+=p;a.revisita+=o.revisita;map.set(key,a);let z={loginTecnico:pick(r,['LOGIN_TECNICO'])||'NAO INFORMADO',grupoOS:ur,tipoInstalacao:tipo,regional:o.regional,cluster:o.cluster,subcluster:o.subcluster,cidade:o.cidade,un,epo,totalOS:t,padrao:p},tk=[z.loginTecnico,ur,tipo,o.regional,o.cluster,o.subcluster,o.cidade,un,epo].join('|'),ta=tm.get(tk)||{...z,totalOS:0,padrao:0};ta.totalOS+=t;ta.padrao+=p;tm.set(tk,ta)}generated={metadata:{competenciaAtual:comp,competencia:comp,arquivoGeradoEm:new Date().toISOString()},dados:[...map.values()],tecnicos:[...tm.values()],historicoMensal:[]};let[y,m]=comp.split('-');name=`${y.slice(2)}-${m}-tec1.json`;$('#status').style.display='block';$('#status').textContent=`✓ JSON pronto: ${name}\nRegistros: ${generated.dados.length}\nTécnicos: ${generated.tecnicos.length}`;$('#download').disabled=false};$('#download').onclick=()=>{let b=new Blob([JSON.stringify(generated)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()};</script></body></html>
