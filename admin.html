<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração TEC1</title><style>:root{--r:#da291c;--rd:#b82018}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Segoe UI,Arial;background:#f4f6f9;color:#17233b}header{height:84px;background:var(--r);color:#fff;display:flex;align-items:center;padding:12px 22px}.brand{display:flex;align-items:center;gap:20px}.claro{position:relative;min-width:120px;font-size:38px;font-weight:900;letter-spacing:-2px}.claro:after{content:'✦';position:absolute;right:3px;top:-15px;font-size:15px}.divider{height:38px;width:1px;background:#ffffffa8}.title{font-size:27px;font-weight:750}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #e8cbc7;border-radius:14px;padding:24px;margin-bottom:18px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:11px;border:2px solid #d6aaa6;border-radius:9px;background:var(--r);color:#fff;text-decoration:none;font-size:16px;font-weight:800}.btn.light{background:#fff1f0;color:var(--rd)}@media(max-width:760px){.actions{grid-template-columns:1fr}}</style></head><body><header><div class="brand"><span class="claro">Claro</span><span class="divider"></span><span class="title">Administração TEC1</span></div></header><main class="wrap"><section class="card"><h2>Publicar arquivos</h2><p>Utilize o conversor já publicado no seu repositório, ou publique o JSON mensal diretamente na pasta dados.</p><div class="actions"><a class="btn" href="https://github.com/otaviofelisberto0-creator/R-TEC1.V2/upload/main/dados" target="_blank">Publicar JSON na pasta dados</a><a class="btn light" href="https://github.com/otaviofelisberto0-creator/R-TEC1.V2/edit/main/dados/manifest.json" target="_blank">Atualizar histórico mensal</a><a class="btn light" href="./index.html">Voltar ao Dashboard</a></div></section></main></body></html>
