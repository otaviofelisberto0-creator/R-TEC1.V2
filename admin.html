<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração TEC1</title><style>body{margin:0;font:16px Segoe UI;background:#f4f6f9;color:#17233b}header{background:#da291c;color:#fff;padding:22px;font-size:26px;font-weight:800}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #e8cbc7;border-radius:14px;padding:22px;margin-bottom:15px}.fields,.actions{display:grid;grid-template-columns:2fr 1fr;gap:12px}.actions{grid-template-columns:repeat(3,1fr);margin-top:16px}input,select,button,a.btn{min-height:48px;padding:9px;border:2px solid #d6aaa6;border-radius:8px;font-size:15px}button,a.btn{background:#da291c;color:#fff;font-weight:800;text-decoration:none;text-align:center}.status{white-space:pre-wrap;margin-top:15px;padding:12px;background:#edf9f2}@media(max-width:700px){.fields,.actions{grid-template-columns:1fr}}</style></head><body><header>Claro | Administração TEC1</header><main class="wrap"><p><a href="./index.html">Dashboard</a> | <a href="./tempo.html">Tempo</a></p><section class="card"><h2>Preparar arquivo mensal</h2><div class="fields"><label>Arquivo CSV<input id="csv" type="file" accept=".csv"></label><label>Competência<select id="comp"></select></label></div><div class="actions"><button id="convert">1. Converter CSV para JSON</button><button id="download" disabled>2. Baixar arquivo JSON</button><a class="btn" href="https://github.com/login" target="_blank">3. Entrar no GitHub</a></div><div id="status" class="status">Aguardando arquivo.</div></section></main><script>
let text='',generated,name;const $=s=>document.querySelector(s),N=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase(),K=v=>N(v).replace(/[^A-Z0-9]/g,''),num=v=>Number(String(v??'').replace(',','.'))||0;function split(l,s){let a=[],x='',q=false;for(let c of l){if(c==='"')q=!q;else if(c===s&&!q){a.push(x);x=''}else x+=c}a.push(x);return a}function parse(t){let l=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),sep=l[0]?.includes(';')?';':',',headers=split(l[0]||'',sep).map(K);return{headers,rows:l.slice(1).map(z=>{let v=split(z,sep),o={};headers.forEach((k,i)=>o[k]=v[i]||'');return o})}}function pick(r,n){for(let x of n){let v=r[K(x)];if(v)return v}return''}function date(v){let m=String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null}function ids(v){return String(v??'').replace(/\.0\b/g,'').match(/\d+/g)||[]}function migration(ur,go,idv){let a=ids(idv);return ur==='INSTALACAO'&&go==='SERVICOS'&&a.includes('24')&&a.includes('191')}let c=$('#comp'),y=new Date().getFullYear();for(let a=y-2;a<=y+1;a++)for(let m=1;m<=12;m++)c.add(new Option(`${a}-${String(m).padStart(2,'0')}`,`${a}-${String(m).padStart(2,'0')}`));$('#csv').onchange=async()=>text=$('#csv').files[0]?await $('#csv').files[0].text():'';$('#convert').onclick=()=>{let p=parse(text);if(!p.headers.includes(K('DATA_AGENDA'))){$('#status').textContent='Bloqueado: DATA_AGENDA não encontrada.';return}let map=new Map(),tm=new Map(),valid=0,invalid=0;for(let r of p.rows){let dt=date(pick(r,['DATA_AGENDA']));if(!dt){invalid++;continue}valid++;let ur=N(pick(r,['UN_RESP'])),go=N(pick(r,['GRUPO_OS'])),idv=pick(r,['LISTA_ID_OS']),tipo=migration(ur,go,idv)?'MIGRACAO':ur==='INSTALACAO'&&go==='INSTALACAO'&&['1','43','51','516'].includes(String(idv).replace(/\.0$/,''))?'ADESAO':'',un=pick(r,['UNIDADE_NEGOCIO']),epo=un.includes('-')?un.split('-').slice(1).join('-'):'NAO INFORMADO',t=num(pick(r,['QTD_TOTAL_OS_TEC1'])),pad=num(pick(r,['TOTAL_OS_TEC1_PADRAO']));if(!t)continue;let o={DATA_AGENDA:dt,grupoOS:ur,tipoInstalacao:tipo,regional:pick(r,['NM_GRUPO_REGIONAL']),cluster:pick(r,['DSC_CLUSTER']),subcluster:pick(r,['SUBCLUSTER']),cidade:pick(r,['NM_MUNICIPIO']),un,epo,totalOS:t,padrao:pad,revisita:num(pick(r,['QT_REVISITA']))},key=[dt,ur,tipo,o.regional,o.cluster,o.subcluster,o.cidade,un,epo].join('|'),a=map.get(key)||{...o,totalOS:0,padrao:0,revisita:0};a.totalOS+=t;a.padrao+=pad;a.revisita+=o.revisita;map.set(key,a);let z={loginTecnico:pick(r,['LOGIN_TECNICO'])||'NAO INFORMADO',...o},tk=[z.loginTecnico,ur,tipo,z.regional,z.cluster,z.subcluster,z.cidade,un,epo].join('|'),ta=tm.get(tk)||{...z,totalOS:0,padrao:0};ta.totalOS+=t;ta.padrao+=pad;tm.set(tk,ta)}let comp=[...map.values()][0]?.DATA_AGENDA.slice(0,7)||c.value;c.value=comp;generated={metadata:{competencia:comp,arquivoGeradoEm:new Date().toISOString(),colunaData:'DATA_AGENDA',regraMigracao:'UN_RESP=INSTALACAO; GRUPO_OS=SERVICOS; LISTA_ID_OS contém simultaneamente 24 e 191; códigos adicionais permitidos'},dados:[...map.values()],tecnicos:[...tm.values()],historicoMensal:[]};name=`tec1-${comp.slice(2,4)}-${comp.slice(5,7)}.json`;$('#status').textContent=`JSON pronto: ${name}\nDatas válidas: ${valid}\nDatas inválidas: ${invalid}\nRegistros: ${generated.dados.length}\nMigração: exige 24 e 191; códigos adicionais são aceitos.`;$('#download').disabled=false};$('#download').onclick=()=>{if(!generated)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(generated)],{type:'application/json'}));a.download=name;a.click()};
</script></body></html>
