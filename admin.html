<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração TEC1</title><style>:root{--r:#da291c;--rd:#b82018;--line:#e8cbc7}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Segoe UI,Arial;background:#f4f6f9;color:#17233b}header{height:84px;background:var(--r);color:white;display:flex;align-items:center;padding:12px 22px}.brand{display:flex;align-items:center;gap:20px}.claro{position:relative;min-width:120px;font-size:38px;font-weight:900;letter-spacing:-2px}.claro:after{content:'✦';position:absolute;right:3px;top:-15px;font-size:15px}.divider{height:38px;width:1px;background:#ffffffaa}.title{font-size:27px}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}.fields{display:grid;grid-template-columns:1.5fr .7fr;gap:14px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}label{font-size:15px;font-weight:700}input,select,.btn{width:100%;min-height:52px;padding:11px 13px;margin-top:6px;border:2px solid #d6aaa6;border-radius:9px;font-size:16px}.btn{display:flex;align-items:center;justify-content:center;background:var(--r);color:white;text-decoration:none;font-weight:800;cursor:pointer}.btn.light{background:#fff3f1;color:var(--rd)}.btn:disabled{background:#bbb;color:#555;cursor:not-allowed}.btn.ready{background:#16883e;border-color:#16883e;color:#fff}.btn.ready:hover{background:#107232}.status{display:none;margin-top:14px;padding:14px;background:#edf9f2;border-left:6px solid #087b42;white-space:pre-wrap}.nav{display:flex;gap:10px;margin-top:15px}.nav a{color:var(--rd);font-weight:700}@media(max-width:750px){.fields,.actions{grid-template-columns:1fr}}</style></head><body><header><div class="brand"><span class="claro">Claro</span><span class="divider"></span><span class="title">Administração TEC1</span></div></header><main class="wrap"><div class="nav"><a href="./index.html">Dashboard</a><a href="./tempo.html">Tempo</a></div><section class="card"><h2>Preparar arquivo mensal</h2><div class="fields"><label>Arquivo CSV<input id="csv" type="file" accept=".csv"></label><label>Competência<select id="comp"></select></label></div><div class="actions"><button id="convert" class="btn">1. Converter CSV para JSON</button><button id="download" class="btn" disabled>2. Baixar arquivo JSON</button><a class="btn light" href="https://github.com/login" target="_blank">3. Entrar no GitHub</a></div><div id="status" class="status"></div></section><section class="card"><h2>Publicar no GitHub</h2><div class="actions"><a class="btn" href="https://github.com/otaviofelisberto0-creator/R-TEC1.V2/upload/main/dados" target="_blank">Publicar JSON na pasta dados</a><a class="btn light" href="https://github.com/otaviofelisberto0-creator/R-TEC1.V2/edit/main/dados/manifest.json" target="_blank">Registrar competência</a><a class="btn light" href="./index.html">Voltar ao Dashboard</a></div></section></main><script>
let text='',generated,name;const $=s=>document.querySelector(s),N=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase(),K=v=>N(v).replace(/[^A-Z0-9]/g,''),num=v=>Number(String(v??'').replace(',','.'))||0;
function split(l,s){let a=[],x='',q=false;for(let c of l){if(c==='"')q=!q;else if(c===s&&!q){a.push(x);x=''}else x+=c}a.push(x);return a}
function parse(t){let l=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);if(!l.length)return{headers:[],rows:[]};let sep=l[0].includes(';')?';':',',headers=split(l[0],sep).map(K),rows=l.slice(1).map(z=>{let v=split(z,sep),o={};headers.forEach((k,i)=>o[k]=v[i]||'');return o});return{headers,rows}}
function pick(r,n){for(let x of n){let v=r[K(x)];if(v)return v}return''}
function dataAgenda(v){let t=String(v??'').trim(),m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;let d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3],test=new Date(`${y}-${mo}-${d}T12:00:00`);return test.getFullYear()===+y&&test.getMonth()+1===+mo&&test.getDate()===+d?`${y}-${mo}-${d}`:null}
function resetDownload(){generated=undefined;name='';$('#download').disabled=true;$('#download').classList.remove('ready')}
let c=$('#comp'),currentYear=new Date().getFullYear();for(let a=currentYear-2;a<=currentYear+1;a++)for(let m=1;m<=12;m++){let v=`${a}-${String(m).padStart(2,'0')}`;c.insertAdjacentHTML('beforeend',`<option value="${v}">${v}</option>`)}
$('#csv').onchange=async()=>{resetDownload();$('#status').style.display='none';let f=$('#csv').files[0];if(!f){text='';return}let b=await f.arrayBuffer();text=new TextDecoder().decode(b);let parsed=parse(text);if(!parsed.headers.includes(K('DATA_AGENDA'))){$('#status').style.display='block';$('#status').textContent='Conversão bloqueada: a coluna obrigatória DATA_AGENDA não foi encontrada no CSV.';return}let comps=new Set(parsed.rows.map(r=>dataAgenda(pick(r,['DATA_AGENDA']))).filter(Boolean).map(d=>d.slice(0,7)));if(comps.size===1)c.value=[...comps][0]};
$('#convert').onclick=()=>{resetDownload();let status=$('#status');status.style.display='block';if(!text){status.textContent='Selecione um arquivo CSV antes de converter.';return}let parsed=parse(text),rows=parsed.rows;if(!parsed.headers.includes(K('DATA_AGENDA'))){status.textContent='Conversão bloqueada: a coluna obrigatória DATA_AGENDA não foi encontrada no CSV.';return}let valid=[],invalid=0,comps=new Set();for(let r of rows){let dt=dataAgenda(pick(r,['DATA_AGENDA']));if(!dt){invalid++;continue}comps.add(dt.slice(0,7));valid.push([r,dt])}if(!valid.length){status.textContent='Conversão bloqueada: nenhuma DATA_AGENDA válida foi encontrada. Formato esperado: DD/MM/AAAA.';return}if(comps.size!==1){status.textContent='Conversão bloqueada: DATA_AGENDA contém mais de uma competência: '+[...comps].sort().join(', ')+'. Separe o CSV por mês.';return}let comp=[...comps][0];c.value=comp;let map=new Map(),tm=new Map(),ignoredNoTotal=0;for(let[r,dt]of valid){let ur=N(pick(r,['UN_RESP'])),go=N(pick(r,['GRUPO_OS'])),to=N(pick(r,['TIPO_OS'])),id=String(pick(r,['LISTA_ID_OS'])).replace(/\.0$/,''),tipo=ur==='INSTALACAO'&&go==='SERVICOS'&&to==='MUDANCA DE PACOTE'&&id==='24'?'MIGRACAO':ur==='INSTALACAO'&&go==='INSTALACAO'&&['1','43','51','516'].includes(id)?'ADESAO':'',un=pick(r,['UNIDADE_NEGOCIO']),epo=un.includes('-')?un.split('-').slice(1).join('-'):'NAO INFORMADO',t=num(pick(r,['QTD_TOTAL_OS_TEC1'])),pad=num(pick(r,['TOTAL_OS_TEC1_PADRAO']));if(!t){ignoredNoTotal++;continue}let o={DATA_AGENDA:dt,grupoOS:ur,tipoInstalacao:tipo,regional:pick(r,['NM_GRUPO_REGIONAL']),cluster:pick(r,['DSC_CLUSTER']),subcluster:pick(r,['SUBCLUSTER']),cidade:pick(r,['NM_MUNICIPIO']),un,epo,totalOS:t,padrao:pad,treinado:0,complete:0,notdone:0,revisita:num(pick(r,['QT_REVISITA']))},key=[dt,ur,tipo,o.regional,o.cluster,o.subcluster,o.cidade,un,epo].join('|'),a=map.get(key)||{...o,totalOS:0,padrao:0,revisita:0};a.totalOS+=t;a.padrao+=pad;a.revisita+=o.revisita;map.set(key,a);let z={loginTecnico:pick(r,['LOGIN_TECNICO'])||'NAO INFORMADO',grupoOS:ur,tipoInstalacao:tipo,regional:o.regional,cluster:o.cluster,subcluster:o.subcluster,cidade:o.cidade,un,epo,totalOS:t,padrao:pad},tk=[z.loginTecnico,ur,tipo,o.regional,o.cluster,o.subcluster,o.cidade,un,epo].join('|'),ta=tm.get(tk)||{...z,totalOS:0,padrao:0};ta.totalOS+=t;ta.padrao+=pad;tm.set(tk,ta)}generated={metadata:{competenciaAtual:comp,competencia:comp,arquivoGeradoEm:new Date().toISOString(),colunaData:'DATA_AGENDA'},dados:[...map.values()],tecnicos:[...tm.values()],historicoMensal:[]};let[y,m]=comp.split('-');name=`tec1-${y.slice(2)}-${m}.json`;status.textContent=`✓ JSON pronto: ${name}\nColuna de data: DATA_AGENDA\nCompetência identificada: ${comp}\nLinhas do CSV: ${rows.length}\nDatas válidas: ${valid.length}\nDatas inválidas: ${invalid}\nLinhas sem total OS: ${ignoredNoTotal}\nRegistros consolidados: ${generated.dados.length}\nTécnicos: ${generated.tecnicos.length}`;$('#download').disabled=false;$('#download').classList.add('ready')};
$('#download').onclick=()=>{if(!generated)return;let b=new Blob([JSON.stringify(generated)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
