<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard TEC1</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>:root{--r:#da291c;--rd:#b82018;--y:#ffd600;--line:#e8cbc7}*{box-sizing:border-box}body{margin:0;padding-bottom:38px;font:16px/1.45 Segoe UI,Arial;background:#f4f6f9;color:#17233b}header{height:84px;background:var(--r);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;position:sticky;top:0;z-index:50}.brand{display:flex;align-items:center;gap:20px}.claro{position:relative;font-size:38px;font-weight:900;letter-spacing:-2px;min-width:120px}.claro:after{content:"✦";position:absolute;right:3px;top:-15px;font-size:15px}.divider{height:38px;width:1px;background:#ffffffaa}.title{font-size:27px;font-weight:750}.meta{text-align:right;font-size:13px}.meta select{min-height:42px;padding:7px;border:2px solid #fff;border-radius:8px;font-size:16px}.layout{display:grid;grid-template-columns:72px 1fr}.layout.open{grid-template-columns:230px 1fr}.side{background:var(--r);height:calc(100vh - 84px);position:sticky;top:84px;padding:10px;overflow:hidden}.side a,.side button{display:flex;align-items:center;gap:12px;width:100%;height:50px;margin-bottom:8px;padding:0 14px;border:1px solid #ffffff80;border-radius:9px;background:transparent;color:#fff;text-decoration:none;font-size:16px;font-weight:700;white-space:nowrap}.txt{display:none}.open .txt{display:inline}.ico{font-size:21px;min-width:24px}main{min-width:0;padding:18px}.card,.box,.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:13px}h1{font-size:29px;margin:0 0 14px}h2{font-size:21px;margin:0 0 10px}.filters{display:grid;grid-template-columns:repeat(6,minmax(145px,1fr));gap:9px}.filters label{font-size:14px;font-weight:700}.filters select,.filters button{width:100%;min-height:47px;margin-top:4px;padding:8px;border:2px solid #d6aaa6;border-radius:8px;font-size:15px}.filters button{background:var(--r);color:#fff;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.kpi{border-top:6px solid var(--r)}.kpi small{font-size:16px;font-weight:700}.kpi b{display:block;font-size:40px}.viewport{overflow:auto;max-height:620px}.chart{height:455px;min-width:1120px}.matrix{border-collapse:separate;border-spacing:0;min-width:1420px;width:100%;font-size:14px}.matrix th{position:sticky;top:0;background:var(--r);color:#fff;z-index:10}.matrix th,.matrix td{height:43px;padding:8px;border-bottom:1px solid #ddd;text-align:center;white-space:nowrap}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;min-width:185px;background:#fff;z-index:12}.matrix th:first-child{background:var(--r)}.good{background:#edf9f2;color:#063;font-weight:800}.bad{background:#fff0f2;color:#a10020;font-weight:800}.footer{position:fixed;bottom:0;left:0;right:0;background:#000;color:var(--y);padding:8px;text-align:center;font-size:12px}@media(max-width:900px){.filters{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.layout,.layout.open{display:block}.side{position:static;height:auto;display:flex;overflow:auto}.txt,.open .txt{display:none}.filters{grid-template-columns:1fr}.kpis{display:flex;overflow:auto}.kpi{min-width:250px}}</style></head><body><header><div class="brand"><span class="claro">Claro</span><span class="divider"></span><span class="title">Dashboard TEC1</span></div><div class="meta"><label>Competência <select id="competencia"></select></label><div id="updated"></div></div></header><div id="layout" class="layout"><nav class="side"><button id="toggle"><span class="ico">☰</span><span class="txt">Menu</span></button><a href="./index.html"><span class="ico">▣</span><span class="txt">Dashboard</span></a><a href="./tempo.html"><span class="ico">☀</span><span class="txt">Tempo</span></a><a href="./admin.html"><span class="ico">⚙</span><span class="txt">Administração</span></a></nav><main><h1>Análise TEC1</h1><section class="box"><div class="filters"><label>Grupo OS<select id="fOS"></select></label><label>Tipo de Instalação<select id="fTipo"></select></label><label>Grupo<select id="fGrupo"></select></label><label>Cluster<select id="fCluster"></select></label><label>SubCluster<select id="fSub"></select></label><label>Cidade<select id="fCidade"></select></label><label>UN<select id="fUn"></select></label><label>EPO<select id="fEpo"></select></label><label>Ações<button id="reset">Limpar filtros</button></label></div></section><section id="kpis" class="kpis"></section><div id="content"></div></main></div><footer class="footer">MATERIAL CRIADO POR OTAVIO J. FELISBERTO - GRUPO SC - GRUPO CLUSTER FLORIANÓPOLIS - Diretoria de Serviços Técnicos | Instalações RPS</footer><script>let ALL=[],TECH=[],ITEMS=[],charts=[];const $=s=>document.querySelector(s),D=[['fOS','grupoOS'],['fTipo','tipoInstalacao'],['fGrupo','regional'],['fCluster','cluster'],['fSub','subcluster'],['fCidade','cidade'],['fUn','un'],['fEpo','epo']],pct=(a,b)=>b?100*a/b:null,fmt=v=>v==null?'-':v.toFixed(1).replace('.',',')+'%',cl=v=>v==null?'':v<95.7?'bad':'good';function st(){return Object.fromEntries(D.map(([i,f])=>[f,$('#'+i).value||'TODOS']))}function ok(r,s,skip){return D.every(([,f])=>f===skip||s[f]==='TODOS'||r[f]===s[f])}function fill(){let s=st();for(let[id,f]of D){let e=$('#'+id),old=e.value||'TODOS',v=[...new Set(ALL.filter(r=>ok(r,s,f)).map(r=>r[f]).filter(Boolean))].sort();e.innerHTML='<option value="TODOS">Todos</option>'+v.map(x=>`<option>${x}</option>`).join('');e.value=v.includes(old)?old:'TODOS'}}function context(){let s=st(),a=[];if(s.grupoOS!=='TODOS')a.push(s.grupoOS);if(s.tipoInstalacao!=='TODOS')a.push(s.tipoInstalacao);return a.length?' - '+a.join(' - '):''}function days(){let[y,m]=$('#competencia').value.split('-').map(Number);return Array.from({length:new Date(y,m,0).getDate()},(_,i)=>i+1)}const labels={id:'labels',afterDatasetsDraw(c){let{ctx,chartArea}=c;ctx.save();c.data.datasets.forEach((d,j)=>c.getDatasetMeta(j).data.forEach((p,i)=>{let v=d.data[i];if(v==null)return;let t=fmt(v),y=p.y+(c.data.datasets.length<=2?(j?-22:-17):(-18+(j%4)*12));ctx.font='800 16px Segoe UI';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(t,p.x,Math.max(chartArea.top+17,y));ctx.fillStyle=d.borderColor;ctx.fillText(t,p.x,Math.max(chartArea.top+17,y))}));ctx.restore()}};Chart.register(labels);function graph(r,f,title,max=8){let ds=days(),groups=[...new Set(r.map(x=>x[f]).filter(Boolean))].map(n=>({n,t:r.filter(x=>x[f]===n).reduce((a,x)=>a+x.totalOS,0)})).sort((a,b)=>b.t-a.t).slice(0,max),colors=['#da291c','#0670c4','#00856a','#70499d','#d56b00','#00717c','#9f3a56','#555'],cv=document.createElement('canvas'),card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${title}${context()}</h2><div class="viewport chart"></div>`;card.querySelector('.chart').appendChild(cv);$('#content').appendChild(card);let sets=groups.map((g,j)=>({label:g.n,borderColor:colors[j%8],borderWidth:3,pointRadius:4,tension:.14,data:ds.map(day=>{let date=$('#competencia').value+'-'+String(day).padStart(2,'0'),q=r.filter(x=>x[f]===g.n&&x.data===date);return pct(q.reduce((a,x)=>a+x.padrao,0),q.reduce((a,x)=>a+x.totalOS,0))})}));charts.push(new Chart(cv,{type:'line',data:{labels:ds,datasets:sets},options:{maintainAspectRatio:false,layout:{padding:{top:66}},plugins:{legend:{position:'bottom',labels:{font:{size:15}}}},scales:{x:{ticks:{autoSkip:false,font:{size:13}}},y:{min:80,max:100,ticks:{font:{size:14},callback:v=>v+'%'}}}}}))}function table(r,f,title,epo=false){let ds=days(),gs=[...new Set(r.map(x=>x[f]).filter(Boolean))].sort(),h=`<section class="card"><h2>${title}${context()}</h2><div class="viewport"><table class="matrix"><thead><tr><th>${f==='un'?'UN':f==='epo'?'EPO':'Cluster'}</th>${epo?'<th>EPO</th>':''}<th>ACUM.</th>${ds.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`;for(let g of gs){let q=r.filter(x=>x[f]===g),v=pct(q.reduce((a,x)=>a+x.padrao,0),q.reduce((a,x)=>a+x.totalOS,0));h+=`<tr><td>${g}</td>${epo?`<td>${q[0]?.epo||''}</td>`:''}<td class="${cl(v)}">${fmt(v)}</td>`+ds.map(day=>{let z=q.filter(x=>x.data===$('#competencia').value+'-'+String(day).padStart(2,'0')),p=pct(z.reduce((a,x)=>a+x.padrao,0),z.reduce((a,x)=>a+x.totalOS,0));return`<td class="${cl(p)}">${fmt(p)}</td>`}).join('')+'</tr>'}$('#content').insertAdjacentHTML('beforeend',h+'</tbody></table></div></section>')}async function render(){fill();charts.forEach(x=>x.destroy());charts=[];$('#content').innerHTML='';let s=st(),r=ALL.filter(x=>ok(x,s)),G=['RPS','Grupo SC','Grupo PR'];$('#kpis').innerHTML=G.map(g=>{let q=g==='RPS'?r:r.filter(x=>x.regional===g),v=pct(q.reduce((a,x)=>a+x.padrao,0),q.reduce((a,x)=>a+x.totalOS,0));return`<div class="kpi"><small>${g} x % TEC1</small><b>${fmt(v)}</b></div>`}).join('');graph(r,'regional','Grupo SC x Grupo PR',2);graph(r,'subcluster','TEC1 por SubCluster');graph(r,'cidade','TEC1 por Cidade');graph(r,'epo','TEC1 por EPO');graph(r,'un','TEC1 por UN');table(r,'cluster','% TEC1 diário por Cluster');table(r,'epo','% TEC1 diário por EPO');table(r,'un','% TEC1 diário por UN',true);let m=new Map();for(let x of TECH.filter(x=>ok(x,s))){let k=[x.loginTecnico,x.un,x.epo,x.cidade,x.subcluster].join('|'),a=m.get(k)||{...x,totalOS:0,padrao:0};a.totalOS+=x.totalOS;a.padrao+=x.padrao;m.set(k,a)}let vals=[...m.values()].sort((a,b)=>pct(a.padrao,a.totalOS)-pct(b.padrao,b.totalOS));$('#content').insertAdjacentHTML('beforeend','<section class="card"><h2>Desempenho TEC1 por técnico'+context()+'</h2><div class="viewport"><table class="matrix"><thead><tr><th>Login do Técnico</th><th>UN</th><th>EPO</th><th>Cidade</th><th>SubCluster</th><th>% TEC1</th></tr></thead><tbody>'+vals.map(x=>{let v=pct(x.padrao,x.totalOS);return`<tr><td>${x.loginTecnico}</td><td>${x.un}</td><td>${x.epo}</td><td>${x.cidade}</td><td>${x.subcluster}</td><td class="${cl(v)}">${fmt(v)}</td></tr>`}).join('')+'</tbody></table></div></section>')}async function start(){let m=await fetch('./dados/manifest.json?t='+Date.now()).then(r=>r.json());ITEMS=m.arquivos.filter(x=>x.ativo!==false);let c=$('#competencia');c.innerHTML=ITEMS.map(x=>`<option value="${x.competencia}">${x.rotulo}</option>`).join('');c.value=m.competenciaAtual;async function load(){let i=ITEMS.find(x=>x.competencia===c.value),j=await fetch('./dados/'+i.arquivo+'?t='+Date.now()).then(r=>r.json());ALL=j.dados||[];TECH=j.tecnicos||[];let d=j.metadata?.ultimoRegistroEm||j.metadata?.arquivoGeradoEm;$('#updated').textContent=d?'Última atualização: '+new Date(d).toLocaleString('pt-BR'):'Atualização não informada';D.forEach(([id])=>$('#'+id).value='TODOS');render()}c.onchange=load;await load()}D.forEach(([id])=>$('#'+id).onchange=render);$('#reset').onclick=()=>{D.forEach(([id])=>$('#'+id).value='TODOS');render()};$('#toggle').onclick=()=>$('#layout').classList.toggle('open');start();</script></body></html>
