<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Análise TEC1</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font:16px Segoe UI,Arial;background:#f5f6f8;color:#14213d}header{background:#da291c;color:#fff;padding:18px;display:flex;justify-content:space-between}main{padding:16px}.box,.kpi,.card{background:#fff;border:1px solid #ead0cc;border-radius:12px;padding:14px;margin-bottom:12px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.filters label{font-weight:700;font-size:15px}.filters select{width:100%;height:110px;font:15px Segoe UI;border:2px solid #d6aaa6;border-radius:8px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{border-top:5px solid #da291c}.kpi b{display:block;font-size:36px}.chart{height:430px}.note{font-size:12px;color:#667085}.toolbar{display:flex;gap:10px;align-items:center}.toolbar select,.toolbar button{min-height:40px;border-radius:7px;padding:7px}.toolbar button{background:#fff;color:#da291c;border:1px solid #fff;font-weight:700}.data{font-size:12px;color:#667085;font-weight:600}.err{padding:15px;border:1px solid #f0b4ae;background:#fff1f0;border-radius:8px}.nav a{color:#fff;margin-left:14px;font-weight:700}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.kpis{display:flex;overflow:auto}.kpi{min-width:230px}.chart{min-width:950px}.scroll{overflow:auto}}@media(max-width:500px){.filters{grid-template-columns:1fr}}
:root{--sideW:52px;--sideOpen:220px}.layoutShell{display:grid;grid-template-columns:var(--sideW) minmax(0,1fr);transition:.2s}.layoutShell.menuOpen{grid-template-columns:var(--sideOpen) minmax(0,1fr)}.sideMenu{background:#da291c;min-height:calc(100vh - 70px);position:sticky;top:70px;padding:8px 5px;overflow:hidden}.sideMenu a,.sideMenu button{display:flex;align-items:center;gap:11px;width:100%;height:38px;margin-bottom:5px;padding:0 10px;border:1px solid #ffffff99;border-radius:7px;background:transparent;color:#fff;text-decoration:none;font:700 14px "Segoe UI",Arial;white-space:nowrap;cursor:pointer}.sideMenu .ico{font-size:17px;min-width:20px;text-align:center}.sideMenu .menuText{opacity:0;transition:.15s}.menuOpen .sideMenu .menuText{opacity:1}.dashboardMain{min-width:0;padding:14px}.filterHead{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}.filterHead h2{margin:0}.filterToggle{border:1px solid #d6aaa6;border-radius:7px;background:#fff;color:#b82018;min-height:34px;padding:5px 10px;font:700 13px "Segoe UI",Arial}.filterBody{display:block;margin-top:10px}.filterBox.collapsed .filterBody{display:none}.filterBox.collapsed{padding-bottom:10px}.filters{grid-template-columns:repeat(6,minmax(145px,1fr))}.filters select{height:92px;font-size:13px;line-height:1.25}.filters label{font-size:13px}.note{font-size:11px}@media(max-width:1050px){.filters{grid-template-columns:repeat(3,minmax(145px,1fr))}}@media(max-width:800px){.layoutShell,.layoutShell.menuOpen{display:block}.sideMenu{position:static;min-height:0;display:flex;overflow:auto}.sideMenu a,.sideMenu button{min-width:42px;width:auto}.sideMenu .menuText,.menuOpen .sideMenu .menuText{display:none}.dashboardMain{padding:10px}.filters{grid-template-columns:repeat(2,minmax(130px,1fr))}}@media(max-width:520px){.filters{grid-template-columns:1fr}.filters select{height:84px}}
</style></head><body><header><div><b style="font-size:30px">Claro</b> &nbsp; Dashboard TEC1</div><div class="toolbar"><label>Competência <select id="comp"></select></label><button id="clear">Limpar filtros</button><span class="nav"><a href="./tempo.html">Tempo</a><a href="./admin.html">Administração</a></span></div></header><div id="layoutShell" class="layoutShell"><nav class="sideMenu"><button id="menuToggle" type="button"><span class="ico">☰</span><span class="menuText">Menu</span></button><a href="./index.html"><span class="ico">▣</span><span class="menuText">Dashboard</span></a><a href="./tempo.html"><span class="ico">☀</span><span class="menuText">Tempo</span></a><a href="./admin.html"><span class="ico">⚙</span><span class="menuText">Administração</span></a></nav><main class="dashboardMain"><h1>Análise TEC1</h1><section id="filterBox" class="box filterBox"><div class="filterHead" id="filterHead"><h2>Filtros</h2><button id="filterToggle" class="filterToggle" type="button">Recolher filtros</button></div><div class="filterBody"><p class="note">Use Ctrl para selecionar opções separadas. Grupo OS inicia em INSTALAÇÃO, mas MANUTENÇÃO e DESCONEXÃO continuam disponíveis para seleção.</p><div id="filters" class="filters"></div></div></section><section id="kpis" class="kpis"></section><div id="content"></div></main></div><script>
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase(),D=[['Grupo OS','grupoOS'],['Tipo de Instalação','tipoInstalacao'],['Grupo','regional'],['Cluster','cluster'],['SubCluster','subcluster'],['Cidade','cidade'],['UN','un'],['EPO','epo']],$=s=>document.querySelector(s),pct=(a,b)=>b?100*a/b:null,fmt=v=>v==null?'Sem cálculo':v.toFixed(1).replace('.',',')+'%';let ALL=[],SEL={},CH=[],MONTH_ROWS=[];function applyDefaultGrupoOS(){let v=[...new Set(ALL.map(x=>x.grupoOS).filter(Boolean))].find(x=>norm(x)==='INSTALACAO');SEL.grupoOS=v?[String(v)]:['TODOS']}function initSel(){SEL=Object.fromEntries(D.map(x=>[x[1],['TODOS']]))}function ok(r,skip){return D.every(([,f])=>f===skip||SEL[f].includes('TODOS')||SEL[f].includes(String(r[f]??'')))}function selected(e){let a=[...e.selectedOptions].map(o=>o.value);return !a.length||a.includes('TODOS')?['TODOS']:a}function fill(){D.forEach(([,f],i)=>{let e=$('#f'+i),old=SEL[f],v=[...new Set((f==='grupoOS'?ALL:ALL.filter(r=>ok(r,f))).map(r=>r[f]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));e.innerHTML='<option value="TODOS">Todos</option>'+v.map(x=>`<option value="${x}">${f==='grupoOS'&&norm(x)==='INSTALACAO'?'INSTALAÇÃO':f==='grupoOS'&&norm(x)==='MANUTENCAO'?'MANUTENÇÃO':f==='grupoOS'&&norm(x)==='DESCONEXAO'?'DESCONEXÃO':x}</option>`).join('');[...e.options].forEach(o=>o.selected=old.includes(o.value));if(![...e.selectedOptions].length){e.options[0].selected=true;SEL[f]=['TODOS']}})}function days(){let[y,m]=$('#comp').value.split('-').map(Number);return Array.from({length:new Date(y,m,0).getDate()},(_,i)=>i+1)}function upto(r){let d=r.map(x=>x.DATA_AGENDA).filter(Boolean).sort().at(-1);return d?'Dados até '+d.slice(8,10)+'/'+d.slice(5,7):'Dados até -'}const lab={id:'lab',afterDatasetsDraw(c){let x=c.ctx;x.save();c.data.datasets.forEach((d,j)=>{if(d.help)return;c.getDatasetMeta(j).data.forEach((p,i)=>{let v=d.data[i]?.y;if(v==null)return;x.font='bold 13px Segoe UI';x.textAlign='center';x.fillStyle=d.borderColor;x.fillText(fmt(v),p.x,p.y-10)})});x.restore()}};Chart.register(lab);function graph(rows,field,title,max=8){let ds=days(),names=[...new Set(rows.map(x=>x[field]).filter(Boolean))].slice(0,max),colors=['#da291c','#0670c4','#00856a','#70499d','#d56b00','#00717c','#9f3a56','#555'],sets=names.map((n,j)=>({label:n,borderColor:colors[j],backgroundColor:colors[j],borderWidth:3,pointRadius:4,spanGaps:true,segment:{borderColor:c=>Math.abs(c.p1DataIndex-c.p0DataIndex)>1?'#9aa3ad':colors[j],borderDash:c=>Math.abs(c.p1DataIndex-c.p0DataIndex)>1?[7,6]:undefined},data:ds.map(d=>{let date=$('#comp').value+'-'+String(d).padStart(2,'0'),q=rows.filter(x=>x[field]===n&&x.DATA_AGENDA===date),t=q.reduce((a,x)=>a+(+x.totalOS||0),0),p=q.reduce((a,x)=>a+(+x.padrao||0),0);return{x:d,y:pct(p,t),total:t,padrao:p,date}})}));sets.push({label:'Intervalo sem cálculo',help:true,data:[],borderColor:'#9aa3ad',borderDash:[7,6]});let low=sets.some(s=>!s.help&&s.data.some(x=>x.y!=null&&x.y<80)),card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${title}</h2><div class="scroll"><div class="chart"><canvas></canvas></div></div><p class="note"><b>0,0%</b> indica quebra real: houve OS e nenhuma ficou no padrão. Linha cinza tracejada: intervalo sem cálculo por ausência de OS válida.</p>`;$('#content').appendChild(card);CH.push(new Chart(card.querySelector('canvas'),{type:'line',data:{labels:ds,datasets:sets},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{title:a=>'DATA_AGENDA: '+String(a[0].label).padStart(2,'0')+'/'+$('#comp').value.slice(5,7),label:i=>i.dataset.help?'Intervalo sem cálculo':i.dataset.label+': '+fmt(i.raw.y),afterLabel:i=>i.dataset.help?'Sem OS válida':['OS padrão: '+i.raw.padrao,'OS total: '+i.raw.total,i.raw.y===0?'Quebra real':'']}}},scales:{y:{min:low?0:80,max:100,ticks:{callback:v=>v+'%'}},x:{ticks:{autoSkip:false}}}}}))}function monthGroupTable(){let rows=MONTH_ROWS.filter(x=>norm(x.grupoOS)==='INSTALACAO'),months=[...new Set(rows.map(x=>x.competencia))].sort(),groups=['RPS','Grupo SC','Grupo PR'],calc=(g,m)=>{let q=rows.filter(x=>x.competencia===m&&(g==='RPS'||x.regional===g));return pct(q.reduce((a,x)=>a+(+x.padrao||0),0),q.reduce((a,x)=>a+(+x.totalOS||0),0))},h=`<section id="tabela-mes-grupo" class="card"><h2>% TEC1 Mês x Mês por Grupo - INSTALAÇÃO</h2><div class="data">Consolidado por competência</div><div class="scroll"><table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:16px"><thead><tr style="background:#da291c;color:#fff"><th style="padding:14px;text-align:left">Grupo</th>${months.map(m=>`<th style="padding:14px">${m.slice(5,7)}/${m.slice(2,4)}</th>`).join('')}</tr></thead><tbody>`;for(let g of groups){h+=`<tr><td style="padding:14px;border-bottom:1px solid #ddd">${g}</td>`+months.map(m=>{let v=calc(g,m);return `<td class="${v==null?'':v<95.7?'bad':'good'}" style="padding:14px;text-align:center;border-bottom:1px solid #ddd;font-weight:800">${fmt(v)}</td>`}).join('')+'</tr>'}h+='</tbody></table></div></section>';$('#content').insertAdjacentHTML('beforeend',h)}function render(){fill();CH.forEach(x=>x.destroy());CH=[];$('#content').innerHTML='';let r=ALL.filter(x=>ok(x));$('#kpis').innerHTML=['RPS','Grupo SC','Grupo PR'].map(g=>{let q=g==='RPS'?ALL:ALL.filter(x=>x.regional===g),v=pct(q.reduce((a,x)=>a+(+x.padrao||0),0),q.reduce((a,x)=>a+(+x.totalOS||0),0));return`<div class="kpi"><small>${g} x % TEC1</small><b>${fmt(v)}</b></div>`}).join('');monthGroupTable();[['regional','Grupo SC x Grupo PR',2],['subcluster','TEC1 por SubCluster',8],['cidade','TEC1 por Cidade',8],['epo','TEC1 por EPO',8],['un','TEC1 por UN',8]].forEach(x=>graph(r,...x));$('#content').insertAdjacentHTML('beforeend',`<section class="card"><div class="data">${upto(r)}</div><p>As análises usam exclusivamente DATA_AGENDA. DATA_NOTA é desconsiderada.</p></section>`)}async function start(){initSel();$('#filters').innerHTML=D.map((x,i)=>`<label>${x[0]}<select id="f${i}" multiple></select></label>`).join('');D.forEach(([,f],i)=>$('#f'+i).onchange=e=>{SEL[f]=selected(e.target);render()});$('#clear').onclick=()=>{initSel();applyDefaultGrupoOS();fill();render()};try{let m=await fetch('./dados/manifest.json?t='+Date.now()).then(r=>r.json()),items=(m.arquivos||[]).filter(x=>x.ativo!==false),loads=await Promise.all(items.map(async it=>({it,j:await fetch('./dados/'+it.arquivo+'?t='+Date.now()).then(r=>r.json())})));$('#comp').innerHTML=items.map(x=>`<option value="${x.competencia}">${x.rotulo}</option>`).join('');$('#comp').value=m.competenciaAtual||items.at(-1)?.competencia;MONTH_ROWS=loads.flatMap(x=>(x.j.dados||[]).map(r=>({...r,competencia:x.it.competencia})));let load=()=>{ALL=loads.find(x=>x.it.competencia===$('#comp').value)?.j.dados||[];initSel();applyDefaultGrupoOS();fill();render()};$('#comp').onchange=load;load()}catch(e){$('#content').innerHTML='<div class="err"><b>Não foi possível carregar os dados.</b><br>Confirme a pasta dados, o manifest.json e os arquivos JSON publicados no GitHub.</div>'}}$('#menuToggle').onclick=()=>$('#layoutShell').classList.toggle('menuOpen');$('#filterHead').onclick=e=>{if(e.target.closest('#filterToggle')||e.target.id==='filterHead'||e.target.tagName==='H2'){let b=$('#filterBox'),c=b.classList.toggle('collapsed');$('#filterToggle').textContent=c?'Expandir filtros':'Recolher filtros'}};start();
</script></body></html>
