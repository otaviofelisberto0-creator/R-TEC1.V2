<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard TEC1 - Histórico Mensal</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>
:root{--red:#d40032;--dark:#76001d;--light:#fff1f4;--ink:#10213c;--line:#e4cbd1}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f5f7fa;color:var(--ink)}header{min-height:76px;align-items:center;line-height:1.25;background:linear-gradient(110deg,#660018,var(--red));color:#fff;padding:12px 18px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20}.layout{display:grid;grid-template-columns:60px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:8px;transition:.2s}.open{grid-template-columns:180px 1fr}.side button{border:0;border-radius:9px;background:var(--light);color:var(--dark);height:42px;width:44px;margin-bottom:8px;font-weight:800}.open .side button{width:164px}.txt{display:none}.open .txt{display:inline}.main{padding:15px;min-width:0}.filters{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr)) 130px;gap:7px;background:#fff;padding:10px;border:1px solid var(--line);border-radius:12px}.filters label{font-size:9px;font-weight:800}.filters select,.filters button{width:100%;padding:8px;margin-top:3px;border:1px solid #d6aab5;border-radius:7px;background:white}.filters button{background:var(--dark);color:white;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:10px;margin:10px 0}.kpi{min-height:96px;display:flex;flex-direction:column;justify-content:center}.kpi small{font-size:13px}.kpi b{font-size:29px}.kpi,.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.kpi{border-top:4px solid var(--red)}.kpi small{font-weight:800}.kpi b{display:block;font-size:21px;margin-top:4px}.card{margin:10px 0;overflow:auto}.chart{height:420px;min-width:700px}.matrixWrap{overflow:auto;max-height:520px}.matrix{border-collapse:separate;border-spacing:0;min-width:1400px;font-size:9px}.matrix th{position:sticky;top:0;background:var(--red);color:#fff;padding:7px}.matrix td{padding:5px;border-bottom:1px solid #ddd;text-align:center}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#fff}.matrix th:first-child{background:var(--red)}.bad{color:#c00027}.good{color:#087b42}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.simple{width:100%;border-collapse:collapse}.simple th{background:var(--dark);color:#fff;padding:8px}.simple td{padding:7px;border-bottom:1px solid #eee}.collapse{float:right;background:var(--light);color:var(--dark);border:1px solid #e5a7b7;border-radius:6px;padding:5px}.collapsed .inside{display:none}@media(max-width:1200px){.filters{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(3,minmax(190px,1fr))}}@media(max-width:700px){.layout,.open{display:block}.side{display:flex;gap:5px;position:sticky;top:55px;z-index:10}.open .side button{width:auto}.filters{grid-template-columns:1fr 1fr}.kpis{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x mandatory;padding-bottom:4px}.kpi{min-width:210px;scroll-snap-align:start}.grid2{grid-template-columns:1fr}.main{padding:8px}.chart{height:340px}}
.brandTitle{font-size:30px;font-weight:900;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.18)}@media(max-width:700px){header{min-height:64px}.brandTitle{font-size:22px}}.matrix th.hist{background:#7b3345}.matrix th.acc{background:#005ea8}.matrix td:nth-child(n+2){white-space:nowrap}.monthCompare{min-width:620px}.monthCompare th:not(:first-child),.monthCompare td:not(:first-child){text-align:center}.card p{font-size:12px;color:#5f6b7a}</style><style>
body{font-size:16px;line-height:1.5}.filters label{font-size:15px!important}.filters select,.filters button{font-size:16px;min-height:50px;padding:11px 12px}.kpi small{font-size:17px}.kpi b{font-size:40px!important}.card h3{font-size:22px}.card p{font-size:15px!important}.matrix{font-size:14px!important}.matrix th,.matrix td{font-size:14px;padding:11px 9px}.simple th,.simple td{font-size:15px;padding:11px}.chart{height:540px}.adminLink{display:block;text-align:center;text-decoration:none;background:var(--light);color:var(--dark);border-radius:9px;min-height:48px;padding:12px 5px;font-size:16px;font-weight:800;margin-bottom:8px}.open .adminLink{width:164px}
</style></head><body><header><b class="brandTitle">Dashboard TEC1</b><span id="meta">Carregando...</span></header><div class="layout" id="layout"><aside class="side"><button id="menu">☰ <span class="txt">Menu</span></button><button>▣ <span class="txt">TEC1</span></button><a class="adminLink" href="./admin.html">⚙ <span class="txt">Admin</span></a></aside><main class="main"><h1>Análise diária TEC1</h1><section class="filters"><label>Grupo OS<select id="fOS"></select></label><label>Tipo Instalação<select id="fTipo"></select></label><label>Grupo<select id="fGrupo"></select></label><label>Cluster<select id="fCluster"></select></label><label>SubCluster<select id="fSub"></select></label><label>Cidade<select id="fCidade"></select></label><label>UN<select id="fUn"></select></label><label>EPO<select id="fEpo"></select></label><label>Ações<button id="reset">Limpar filtros</button></label></section><section class="kpis" id="kpis"></section><div id="charts"></div><div id="matrices"></div><section class="grid2"><article class="card"><h3>UNs com menor % TEC1</h3><table class="simple" id="low"></table></article><article class="card"><h3>Top unidades por volume de OS</h3><table class="simple" id="top"></table></article></section></main></div><script>
const labelPlugin={id:'labels',afterDatasetsDraw(c){let{x,ctx,chartArea}=c;ctx.save();c.data.datasets.forEach((d,j)=>c.getDatasetMeta(j).data.forEach((p,i)=>{let v=d.data[i];if(v==null)return;let t=v.toFixed(1).replace('.',',')+'%';ctx.font='900 14px Segoe UI';ctx.fillStyle=d.borderColor;ctx.textAlign='center';ctx.fillText(t,p.x,Math.max(chartArea.top+8,p.y-10-j*11))}));ctx.restore()}};Chart.register(labelPlugin);let ALL=[],HIST=[],META={},CH={};const $=s=>document.querySelector(s),P=(a,b)=>b?100*a/b:null,F=n=>Number(n||0).toLocaleString('pt-BR'),PP=v=>v==null?'-':v.toFixed(1).replace('.',',')+'%';const dims=[['fOS','grupoOS'],['fTipo','tipoInstalacao'],['fGrupo','regional'],['fCluster','cluster'],['fSub','subcluster'],['fCidade','cidade'],['fUn','un'],['fEpo','epo']];function sel(){return Object.fromEntries(dims.map(([i,f])=>[f,$('#'+i).value||'TODOS']))}
function matches(r,s,skip){return dims.every(([i,f])=>f===skip||s[f]==='TODOS'||r[f]===s[f])}
function rows(skip){let s=sel();return ALL.filter(r=>matches(r,s,skip))}
function optionHtml(v){return `<option value="${String(v).replaceAll('&','&amp;').replaceAll('"','&quot;')}">${v}</option>`}
function fills(){let snapshot=sel();dims.forEach(([i,f])=>{if(f==='tipoInstalacao')return;let e=$('#'+i),old=snapshot[f]||'TODOS',vals=[...new Set(ALL.filter(r=>matches(r,snapshot,f)).map(r=>r[f]).filter(v=>v!=null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));e.innerHTML='<option value="TODOS">Todos</option>'+vals.map(optionHtml).join('');e.value=vals.includes(old)?old:'TODOS'});let os=$('#fOS').value,t=$('#fTipo'),old=snapshot.tipoInstalacao||'TODOS';t.innerHTML='<option value="TODOS">Todos</option><option value="ADESAO">ADESAO</option><option value="MIGRACAO">MIGRACAO</option>';t.disabled=os!=='INSTALACAO';t.value=t.disabled?'TODOS':(['TODOS','ADESAO','MIGRACAO'].includes(old)?old:'TODOS')}
function chartContext(){let s=sel(),parts=[];if(s.grupoOS!=='TODOS')parts.push(s.grupoOS);if(s.grupoOS==='INSTALACAO'&&s.tipoInstalacao!=='TODOS')parts.push(s.tipoInstalacao);return parts.length?' - '+parts.join(' - '):''}
function agg(r,f){let m={};r.forEach(x=>{let o=m[x[f]]||(m[x[f]]={n:x[f],t:0,p:0,tr:0,c:0,no:0,re:0});o.t+=+x.totalOS;o.p+=+x.padrao;o.tr+=+x.treinado;o.c+=+x.complete;o.no+=+x.notdone;o.re+=+x.revisita});return Object.values(m)}function chart(id,f,title,max=10){let r=rows(),days=[...new Set(r.map(x=>x.data))].sort(),g=agg(r,f).sort((a,b)=>b.t-a.t).slice(0,max),cs=['#d40032','#0067b9','#8b1538','#e97800','#00856a','#6950a1','#ad6b00','#006b75','#c44601','#555'];let ds=g.map((z,j)=>({label:z.n,borderColor:cs[j%cs.length],backgroundColor:cs[j%cs.length],data:days.map(d=>{let q=r.filter(x=>x[f]===z.n&&x.data===d);return P(q.reduce((a,x)=>a+x.padrao,0),q.reduce((a,x)=>a+x.totalOS,0))}),tension:.15,pointRadius:3}));let cv=document.createElement('canvas');let art=document.createElement('article');art.className='card';art.innerHTML=`<button class="collapse">Recolher</button><h3>${title}${chartContext()}</h3><div class="inside chart"></div>`;art.querySelector('.inside').appendChild(cv);art.querySelector('.collapse').onclick=()=>art.classList.toggle('collapsed');$('#charts').appendChild(art);new Chart(cv,{type:'line',data:{labels:days.map(d=>d.slice(8,10)+'/'+d.slice(5,7)),datasets:ds},options:{maintainAspectRatio:false,responsive:true,layout:{padding:{top:45}},plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>v+'%'},suggestedMin:75,suggestedMax:100}}}})}function historyRows(){let s=sel();return HIST.filter(r=>dims.every(([i,f])=>s[f]==='TODOS'||r[f]===s[f]))}
function monthLabel(comp){let [y,m]=comp.split('-'),names=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];return (names[Number(m)-1]||m)+'/'+String(y).slice(-2)}
function currentAccumLabel(){if(META.rotuloAcumuladoAtual)return META.rotuloAcumuladoAtual;let comp=META.competenciaAtual||'',m=comp.split('-')[1],names=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];return 'ACUM. '+(names[Number(m)-1]||'ATUAL')}
function availableMonths(pr){let listed=(META.mesesFechados||[]).map(x=>typeof x==='string'?x:x.competencia),found=[...new Set(pr.map(x=>x.competencia).filter(Boolean))];return [...new Set([...listed,...found])].sort()}
function matrix(f,title,second){let r=rows(),pr=historyRows(),days=[...new Set(r.map(x=>x.data))].sort(),months=availableMonths(pr),names=[...new Set([...r.map(x=>x[f]),...pr.map(x=>x[f])])],groups=names.map(n=>{let q=r.filter(x=>x[f]===n);return{n,t:q.reduce((a,x)=>a+(+x.totalOS||0),0),p:q.reduce((a,x)=>a+(+x.padrao||0),0)}}).sort((a,b)=>(P(a.p,a.t)??999)-(P(b.p,b.t)??999));let h=`<article class="card"><h3>% TEC1 diário por ${title}${chartContext()}</h3><div class="matrixWrap"><table class="matrix"><tr><th>${title}</th>${second?'<th>EPO</th>':''}${months.map(m=>`<th class="hist">${monthLabel(m)}</th>`).join('')}<th class="acc">${currentAccumLabel()} ↑</th>${days.map(d=>`<th>${d.slice(8,10)}/${d.slice(5,7)}</th>`).join('')}</tr>`;groups.forEach(z=>{let q=r.filter(x=>x[f]===z.n),pq=pr.filter(x=>x[f]===z.n),acc=P(z.p,z.t);h+=`<tr><td>${z.n}</td>${second?`<td>${[...new Set([...q,...pq].map(x=>x.epo).filter(Boolean))].join(', ')}</td>`:''}`;months.forEach(m=>{let mq=pq.filter(x=>x.competencia===m),v=P(mq.reduce((a,x)=>a+(+x.padrao||0),0),mq.reduce((a,x)=>a+(+x.totalOS||0),0));h+=`<td class="${v==null?'':v<95.7?'bad':'good'}">${PP(v)}</td>`});h+=`<td class="${acc==null?'':acc<95.7?'bad':'good'}">${PP(acc)}</td>`;days.forEach(d=>{let a=q.filter(x=>x.data===d),v=P(a.reduce((s,x)=>s+(+x.padrao||0),0),a.reduce((s,x)=>s+(+x.totalOS||0),0));h+=`<td class="${v==null?'':v<95.7?'bad':'good'}">${PP(v)}</td>`});h+='</tr>'});return h+'</table></div></article>'}
function monthlyComparison(){let pr=historyRows(),months=availableMonths(pr),current=META.competenciaAtual||((ALL[0]&&ALL[0].data)||'').slice(0,7),allMonths=[...months,current].filter(Boolean),groups=['RPS','Grupo SC','Grupo PR'];let value=(month,group)=>{let src=month===current?ALL:pr.filter(x=>x.competencia===month),s=sel();src=src.filter(r=>dims.every(([i,f])=>{if(f==='regional')return group==='RPS'||r.regional===group;return s[f]==='TODOS'||r[f]===s[f]}));return P(src.reduce((a,x)=>a+(+x.padrao||0),0),src.reduce((a,x)=>a+(+x.totalOS||0),0))};let body=groups.map(g=>`<tr><td>${g}</td>${allMonths.map(m=>`<td>${PP(value(m,g))}</td>`).join('')}</tr>`).join('');return `<article class="card"><h3>Comparativo mês x mês${chartContext()}</h3><p>Fechamentos históricos e acumulado da competência atual, respeitando os filtros e mantendo RPS, Grupo SC e Grupo PR.</p><div class="matrixWrap"><table class="simple monthCompare"><tr><th>Visão</th>${allMonths.map(m=>`<th>${m===current?currentAccumLabel():monthLabel(m)}</th>`).join('')}</tr>${body}</table></div></article>`}
function fixedRows(group){let s=sel();return ALL.filter(r=>dims.every(([i,f])=>{if(f==='regional')return group==='RPS'||r.regional===group;return s[f]==='TODOS'||r[f]===s[f]}))}function kpiTec1(group){let r=fixedRows(group),t=r.reduce((a,x)=>a+(+x.totalOS||0),0),p=r.reduce((a,x)=>a+(+x.padrao||0),0);return PP(P(p,t))}function render(){fills();let r=rows(),cards=[['RPS x % TEC1',kpiTec1('RPS')],['Grupo SC x % TEC1',kpiTec1('Grupo SC')],['Grupo PR x % TEC1',kpiTec1('Grupo PR')]];$('#kpis').innerHTML=cards.map(c=>`<div class="kpi"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('');$('#charts').innerHTML='';chart('g','regional','Grupo SC x Grupo PR',2);chart('s','subcluster','TEC1 por SubCluster');chart('c','cidade','TEC1 por Cidade');chart('e','epo','TEC1 por EPO');chart('u','un','TEC1 por UN');$('#matrices').innerHTML=monthlyComparison()+matrix('cluster','Cluster')+matrix('epo','EPO')+matrix('un','UN',true);let a=agg(r,'un'),row=x=>`<tr><td>${x.n}</td><td>${PP(P(x.p,x.t))}</td></tr>`;$('#low').innerHTML='<tr><th>UN</th><th>% TEC1</th></tr>'+a.slice().sort((x,y)=>P(x.p,x.t)-P(y.p,y.t)).slice(0,12).map(row).join('');$('#top').innerHTML='<tr><th>UN</th><th>% TEC1</th></tr>'+a.slice().sort((x,y)=>y.t-x.t).slice(0,12).map(row).join('')}dims.forEach(([i,f])=>$('#'+i).onchange=()=>{if(f==='grupoOS'&&$('#fOS').value!=='INSTALACAO')$('#fTipo').value='TODOS';render()});$('#reset').onclick=()=>{dims.forEach(([i])=>$('#'+i).value='TODOS');render()};$('#menu').onclick=()=>$('#layout').classList.toggle('open');fetch('./dados/tec1-base.json?t='+Date.now()).then(r=>r.json()).then(j=>{ALL=j.dados||[];META=j.metadata||{};HIST=j.historicoMensal||[];if(!HIST.length&&j.dadosMesAnterior){let c=META.mesAnteriorCompetencia||((META.mesAnterior||'').match(/(\d{4})/)&&'2026-07')||'2026-07';HIST=j.dadosMesAnterior.map(x=>({...x,competencia:c}))}$('#meta').textContent='Competência: '+(META.competencia||META.competenciaAtual||'-');render()}).catch(()=>$('#meta').textContent='Base não encontrada');
</script></body></html>
