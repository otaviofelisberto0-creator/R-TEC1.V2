<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impacto | Dashboard TEC1</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--r:#da291c;--rd:#b82018;--ink:#12213b;--line:#dfe4ea;--bg:#f2f4f7;--green:#007a47;--amber:#b66a00}*{box-sizing:border-box}body{margin:0;padding-bottom:34px;font:14px/1.4 "Segoe UI",Arial;background:var(--bg);color:var(--ink)}header{height:84px;background:var(--r);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;position:sticky;top:0;z-index:80}.brand{display:flex;align-items:center;gap:18px}.claro{font-size:35px;font-weight:900;letter-spacing:-2px}.divider{height:38px;width:1px;background:#ffffffa8}.title{font-size:24px;font-weight:800}.upload{padding:9px 13px;border:1px solid #fff;border-radius:8px;background:#fff;color:var(--rd);font-weight:800;cursor:pointer}.upload input{display:none}.layout{display:grid;grid-template-columns:242px minmax(0,1fr)}.side{height:calc(100vh - 84px);position:sticky;top:84px;background:var(--r);padding:10px;overflow:auto}.side a{display:flex;align-items:center;gap:10px;min-height:43px;margin-bottom:6px;padding:8px 10px;border:1px solid #ffffff70;border-radius:8px;color:#fff;text-decoration:none;font-weight:700}.side a:hover,.side a.active{background:#fff;color:var(--rd)}.ico{min-width:22px;text-align:center;font-size:18px}main{min-width:0;padding:16px}.status{margin-bottom:10px;color:#657186;font-size:13px}.filters{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;margin-bottom:10px}.filter{padding:8px;background:#fff;border:1px solid var(--line);border-radius:9px}.filter b{display:block;margin-bottom:4px;font-size:10px;text-transform:uppercase}.filter select{width:100%;min-height:38px;padding:6px;border:1px solid var(--line);border-radius:7px;background:#fff;font-weight:600}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}.impact-kpis{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi small{display:block;color:#344054;font-size:12px}.kpi strong{display:block;margin-top:10px;font-size:24px}.red{color:#d31120}.green{color:var(--green)}.amber{color:var(--amber)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.title2,.head{font-weight:800;font-size:15px;margin-bottom:10px}.bar{display:grid;grid-template-columns:minmax(130px,1.3fr) minmax(150px,3fr) 56px;gap:8px;align-items:center;margin:8px 0}.track{height:14px;background:#edf0f4;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;background:#d11827}.bar b{text-align:left}.tablecard{padding:0;overflow:hidden}.head{padding:13px 14px;margin:0}.scroll{max-height:690px;overflow:auto}.scroll table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}.scroll th,.scroll td{padding:9px 8px;border-bottom:1px solid #e6e9ee;text-align:center;white-space:nowrap}.scroll th{position:sticky;top:0;z-index:3;background:#2f3a4b;color:#fff}.inside{background:#dff6ea;color:#006b3c;font-weight:800}.outside{background:#ffe1e1;color:#a90019;font-weight:800}.nobase{background:#fff2d5;color:#8a5700;font-weight:800}.tag{display:inline-block;padding:3px 9px;border-radius:14px;font-size:11px;font-weight:900}.tag.ok{background:#d9f4e4;color:#006b3c}.tag.no{background:#ffe0e0;color:#a90019}.tag.na{background:#fff0cf;color:#8a5700}.empty{padding:30px;text-align:center;color:#667085}.footer{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#000;color:#ffd600;padding:7px;text-align:center;font-size:11px}@media(max-width:1180px){.filters{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:200px minmax(0,1fr)}}@media(max-width:760px){header{height:auto;gap:10px;align-items:flex-start}.title{font-size:18px}.layout{display:block}.side{position:static;height:auto;display:flex;overflow:auto}.side a{min-width:max-content}.filters{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.bar{grid-template-columns:115px 1fr 48px}main{padding:10px}}
</style></head><body><header><div class="brand"><span class="claro">Claro</span><span class="divider"></span><span class="title">Dashboard TEC1 | Impacto</span></div><label class="upload">Adicionar / Atualizar Analítico<input id="file" type="file" accept=".xlsx,.xls,.csv,.json"></label></header><div class="layout"><nav class="side"><a class="" href="./index.html"><span class="ico">▣</span><span>Dashboard</span></a><a class="" href="./operacional.html"><span class="ico">◆</span><span>Operacional</span></a><a class="" href="./resultado-epo.html"><span class="ico">▤</span><span>Resultado por EPO</span></a><a class="active" href="./impacto.html"><span class="ico">!</span><span>Impacto</span></a><a class="" href="./resultado-tecnico.html"><span class="ico">♟</span><span>Resultado por Técnico</span></a><a class="" href="./conferencia.html"><span class="ico">≣</span><span>Conferência</span></a><a class="" href="./tempo.html"><span class="ico">☀</span><span>Tempo</span></a><a class="" href="./admin.html"><span class="ico">⚙</span><span>Administração</span></a></nav><main><div class="status" id="status">Carregando...</div><div class="filters" id="filters"></div><div class="kpis impact-kpis" id="impactCards"></div><div class="grid"><section class="card"><div class="title2">Combinações de impacto</div><div id="comboBars"></div></section><section class="card"><div class="title2">Potencial de recuperação</div><div id="recoveryBars"></div></section></div></main></div><footer class="footer">MATERIAL CRIADO POR OTAVIO J. FELISBERTO | DASHBOARD TEC1</footer><script>const PAGE='impacto';
let raw=[],metrics=[],state={},baseName='',baseOrigin='';const $=id=>document.getElementById(id),pct=v=>Number.isFinite(v)?(v*100).toFixed(1)+'%':'-',num=v=>Number.isFinite(v)?v.toFixed(2):'-';
const FILTERS=[['GRUPO_ORDEM_SERVICO','Grupo O.S'],['DSC_CLUSTER','Cluster'],['SUBCLUSTER','SubCluster'],['NM_MUNICIPIO','Cidade'],['EPO','EPO'],['UNIDADE_NEGOCIO','Unidade'],['SAFRA','Safra']];
function dt(v){if(v===null||v===undefined||v==='')return null;if(v instanceof Date)return Number.isNaN(v.getTime())?null:v;if(typeof v==='number'&&typeof XLSX!=='undefined'){let o=XLSX.SSF.parse_date_code(v);if(!o)return null;let x=new Date(o.y,o.m-1,o.d,12);return Number.isNaN(x.getTime())?null:x}let t=String(v).trim(),m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/),x;if(m)x=new Date(+m[3],+m[2]-1,+m[1],12);else{x=new Date(t.slice(0,10)+'T12:00:00');if(Number.isNaN(x.getTime()))x=new Date(t)}return Number.isNaN(x.getTime())?null:x}
function mode(a){let c={};a.forEach(x=>c[x]=(c[x]||0)+1);return Object.entries(c).sort((x,y)=>y[1]-x[1])[0]?.[0]||'Não informado'}
function sf(r){let d=dt(r.DATA_AGENDA),i=dt(r.INICIO_DA_SAFRA),f=dt(r.TERMINO_DA_SAFRA);return String(r.IND_VISAO_ETN).toUpperCase()==='S'||d&&i&&d>=i&&(!f||d<=f)}
function prep(){raw=raw.filter(r=>['INSTALACAO','MANUTENCAO'].includes(String(r.GRUPO_ORDEM_SERVICO).trim())&&r.LOGIN_TECNICO);raw.forEach(r=>{if(r.DATA_AGENDA instanceof Date){let x=dt(r.DATA_AGENDA);r.DATA_AGENDA=x?x.toISOString().slice(0,10):''}let u=String(r.UNIDADE_NEGOCIO).toUpperCase();r.EPO=u.includes('FLO-TIME_MDU')?'MDU':u.includes('FLO-TIME02')?'CLARO':u.includes('PROCISA')?'PROCISA':u.includes('VGASAT')?'VGASAT':u.includes('EQS')?'EQS':String(r.PARCEIRO||'OUTROS');r.SAFRA=sf(r)?'Safra':'Não Safra'})}
function calc(a){let g=a[0].GRUPO_ORDEM_SERVICO,c=a.filter(r=>String(r.CONTRATO).trim()),rv=c.filter(r=>+r.QT_REVISITA===1).length,rev=c.length?rv/c.length:null,std=a.reduce((s,r)=>s+(+r.TOTAL_OS_TEC1_PADRAO||0),0),tb=a.reduce((s,r)=>s+(+r.QTD_TOTAL_OS_TEC1||0),0),tec=tb?std/tb:null,d=new Map;a.forEach(r=>{let x=dt(r.DATA_AGENDA),p=+r.QTDE_PONTOS;if(x&&r.QTDE_PONTOS!==''&&Number.isFinite(p)){let k=x.toISOString().slice(0,10);d.set(k,(d.get(k)||0)+p)}});let pts=[...d.values()].reduce((x,y)=>x+y,0),div=g==='INSTALACAO'?110:35,prod=d.size?pts/d.size/div:null,saf=a.some(sf),meta=g==='INSTALACAO'?(saf?1:1.5):(saf?3.5:5),fail=[];if(rev===null)fail.push('Sem base Revisita');else if(rev>.07)fail.push('Revisita');if(tec===null)fail.push('Sem base TEC1');else if(tec<.95)fail.push('TEC1');if(prod===null)fail.push('Sem base Produção');else if(prod<meta)fail.push('Produção');let ev=Number.isFinite(rev)&&Number.isFinite(tec)&&Number.isFinite(prod),status=!ev?'NÃO AVALIADO':fail.length?'FORA':'CERTIFICADO';return{tech:String(a[0].LOGIN_TECNICO),g,epo:mode(a.map(x=>x.EPO)),unit:mode(a.map(x=>String(x.UNIDADE_NEGOCIO||'Não informado'))),saf,rv,cb:c.length,rev,std,tb,tec,pts,days:d.size,div,prod,meta,fail,status}}
function filteredRows(){return raw.filter(r=>FILTERS.every(([k])=>state[k]==='TODOS'||state[k]===String(r[k]||'Não informado')))}
function optionsRows(skip){return raw.filter(r=>FILTERS.every(([k])=>k===skip||state[k]==='TODOS'||state[k]===String(r[k]||'Não informado')))}
function buildFilters(){let host=$('filters');host.innerHTML=FILTERS.map(([k,l])=>`<label class="filter"><b>${l}</b><select data-key="${k}"></select></label>`).join('');FILTERS.forEach(([k])=>state[k]='TODOS');host.addEventListener('change',e=>{if(!e.target.matches('select'))return;state[e.target.dataset.key]=e.target.value;refreshFilters();renderAll()});refreshFilters()}
function refreshFilters(){FILTERS.forEach(([k])=>{let sel=document.querySelector(`select[data-key="${k}"]`),vals=[...new Set(optionsRows(k).map(r=>String(r[k]||'Não informado')))].sort((a,b)=>a.localeCompare(b,'pt-BR')),old=state[k];if(old!=='TODOS'&&!vals.includes(old)){old='TODOS';state[k]='TODOS'}sel.innerHTML='<option value="TODOS">Todos</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');sel.value=old})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function groupMetrics(){let g=new Map;filteredRows().forEach(r=>{let k=r.LOGIN_TECNICO+'|'+r.GRUPO_ORDEM_SERVICO;(g.get(k)||g.set(k,[]).get(k)).push(r)});metrics=[...g.values()].map(calc)}
function impacts(a){let o={Revisita:0,TEC1:0,Produção:0};a.filter(x=>x.status==='FORA').forEach(x=>Object.keys(o).forEach(k=>{if(x.fail.includes(k))o[k]++}));return o}
function bars(id,o,pc=false){let m=Math.max(1,...Object.values(o));$(id).innerHTML=Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><i style="width:${Math.max(0,Math.min(100,pc?v:v/m*100))}%"></i></div><b>${pc?v.toFixed(1)+'%':v}</b></div>`).join('')||'<div class="empty">Sem dados para os filtros selecionados.</div>'}
function cl(v,ok){return!Number.isFinite(v)?'nobase':ok?'inside':'outside'}function tag(x){return`<span class="tag ${x.status==='CERTIFICADO'?'ok':x.status==='FORA'?'no':'na'}">${x.status}</span>`}
function renderOverview(){let ev=metrics.filter(x=>x.status!=='NÃO AVALIADO'),c=ev.filter(x=>x.status==='CERTIFICADO').length,rt=ev.length?c/ev.length:NaN,K=[['% Certificados',pct(rt),rt>=.75?'green':'red'],['Avaliados',ev.length,''],['Certificados',c,'green'],['Fora',ev.length-c,'red'],['Não avaliados',metrics.length-ev.length,'amber'],['Em Safra',metrics.filter(x=>x.saf).length,'amber']];$('kpis').innerHTML=K.map(x=>`<div class="card kpi"><small>${x[0]}</small><strong class="${x[2]}">${x[1]}</strong></div>`).join('');let er={};metrics.forEach(x=>{let k=x.epo+' | '+x.g;(er[k]??=[]).push(x)});Object.entries(er).forEach(([k,a])=>{let v=a.filter(x=>x.status!=='NÃO AVALIADO');er[k]=v.length?v.filter(x=>x.status==='CERTIFICADO').length/v.length*100:0});bars('epoBars',er,true);bars('impactBars',impacts(metrics))}
function renderEpo(){let z={};metrics.forEach(x=>{let k=x.g+'|'+x.epo+'|'+x.unit;(z[k]??=[]).push(x)});$('epoBody').innerHTML=Object.entries(z).sort((a,b)=>a[0].localeCompare(b[0],'pt-BR')).map(([k,v])=>{let [g,e,n]=k.split('|'),ev=v.filter(x=>x.status!=='NÃO AVALIADO'),c=ev.filter(x=>x.status==='CERTIFICADO').length;return`<tr><td>${esc(g)}</td><td>${esc(e)}</td><td>${esc(n)}</td><td>${ev.length}</td><td>${c}</td><td>${ev.length-c}</td><td>${pct(ev.length?c/ev.length:NaN)}</td></tr>`}).join('')||'<tr><td colspan="7">Sem dados.</td></tr>'}
function impactLabel(a){let f=a.filter(i=>['Revisita','TEC1','Produção'].includes(i));return['Produção','Revisita','TEC1'].filter(x=>f.includes(x)).join(' + ')}
function renderImpact(){let f=metrics.filter(x=>x.status==='FORA'),im=impacts(metrics);$('impactCards').innerHTML=Object.entries(im).map(([k,v])=>`<div class="card kpi"><small>${k}</small><strong class="red">${v}</strong></div>`).join('');let co={'TEC1':0,'Revisita':0,'Produção':0,'Revisita + TEC1':0,'Produção + TEC1':0,'Produção + Revisita + TEC1':0,'Produção + Revisita':0},re={'Próximos da meta':0,'Somente TEC1':0,'Somente Revisita':0,'Somente Produção':0};f.forEach(x=>{let a=x.fail.filter(i=>['Revisita','TEC1','Produção'].includes(i)),k=impactLabel(a);if(k in co)co[k]++;if(a.length===1)re['Somente '+a[0]]++;if((x.rev>.07&&x.rev<=.08)||(x.tec<.95&&x.tec>=.90)||(x.prod<x.meta&&x.prod>=x.meta*.9))re['Próximos da meta']++});bars('comboBars',co);bars('recoveryBars',re)}
function renderTech(){$('techBody').innerHTML=metrics.map(x=>`<tr><td>${esc(x.tech)}</td><td>${esc(x.epo)}</td><td>${esc(x.unit)}</td><td>${esc(x.g)}</td><td>${x.saf?'Sim':'Não'}</td><td class="${cl(x.rev,x.rev<=.07)}">${pct(x.rev)}</td><td class="${cl(x.tec,x.tec>=.95)}">${pct(x.tec)}</td><td class="${cl(x.prod,x.prod>=x.meta)}">${num(x.prod)}</td><td>${num(x.meta)}</td><td>${tag(x)}</td><td>${esc(x.fail.join(' + ')||'Sem impacto')}</td></tr>`).join('')||'<tr><td colspan="11">Sem dados.</td></tr>'}
function renderAudit(){$('auditBody').innerHTML=metrics.map(x=>`<tr><td>${esc(x.tech)}</td><td>${esc(x.g)}</td><td>${x.rv}</td><td>${x.cb}</td><td>${pct(x.rev)}</td><td>${x.std}</td><td>${x.tb}</td><td>${pct(x.tec)}</td><td>${x.pts}</td><td>${x.days}</td><td>${x.div}</td><td>${num(x.prod)}</td></tr>`).join('')||'<tr><td colspan="12">Sem dados.</td></tr>'}
function renderAll(){groupMetrics();if(PAGE==='operacional')renderOverview();else if(PAGE==='epo')renderEpo();else if(PAGE==='impacto')renderImpact();else if(PAGE==='tecnico')renderTech();else renderAudit()}
function start(name,origin=''){baseName=name;baseOrigin=origin;prep();buildFilters();renderAll();let extra=origin&&!name.includes('('+origin+')')?' ('+origin+')':'';$('status').textContent=`Base ativa: ${name}${extra} | ${raw.length.toLocaleString('pt-BR')} registros`;try{localStorage.setItem('certificadoBase',JSON.stringify({name,origin,raw}))}catch(e){}}
async function importFile(file){$('status').textContent='Processando '+file.name+'...';let a;if(file.name.toLowerCase().endsWith('.json')){let j=JSON.parse(await file.text());a=Array.isArray(j)?j:(j.dados||j.raw||[])}else{if(typeof XLSX==='undefined')throw Error('Biblioteca de leitura do Excel indisponível.');let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),sn=wb.SheetNames.find(x=>x.trim().toLowerCase()==='analitico')||wb.SheetNames[0];a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''})}let req=['DSC_CLUSTER','SUBCLUSTER','NM_MUNICIPIO','GRUPO_ORDEM_SERVICO','UNIDADE_NEGOCIO','PARCEIRO','LOGIN_TECNICO','DATA_AGENDA','CONTRATO','QTDE_PONTOS','QT_REVISITA','TOTAL_OS_TEC1_PADRAO','QTD_TOTAL_OS_TEC1'],miss=req.filter(x=>!a.length||!(x in a[0]));if(miss.length)throw Error('Colunas obrigatórias ausentes: '+miss.join(', '));raw=a;start(file.name)}
async function init(){try{let z=localStorage.getItem('certificadoBase');if(z){let v=JSON.parse(z);raw=v.raw||[];start(v.name||'Base armazenada',v.origin||'');return}let r=await fetch('./dados/operacional.json?t='+Date.now());if(r.ok){let j=await r.json();raw=Array.isArray(j)?j:(j.dados||j.raw||[]);start(j.metadata?.nomeArquivo||'operacional.json',j.metadata?.origem||'base inicial');return}}catch(e){}raw=[];buildFilters();renderAll();$('status').textContent='Nenhuma base operacional carregada. Use “Adicionar / Atualizar Analítico”.'}
$('file').addEventListener('change',async e=>{try{if(e.target.files[0])await importFile(e.target.files[0])}catch(err){$('status').textContent='Erro: '+err.message}finally{e.target.value=''}});init();
</script></body></html>
